# Postgres สำหรับ development เท่านั้น (ดู CLAUDE.md — hosting/DB สำหรับ prod ยังไม่เลือก)
#   docker compose up -d
# ค่าเชื่อมต่อตรงกับ backend/.env.example : postgres://lms:lms@localhost:5433/lms
# หมายเหตุ: เครื่องนี้มี PostgreSQL 17 (native service) ครองพอร์ต 5432 อยู่แล้ว
#          จึง map container ออกมาที่ host port 5433 กันชนกัน

services:
  db:
    image: postgres:16
    container_name: lms-postgres
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: lms
      TZ: Asia/Bangkok
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
